- thema: "Mengen"
  frage: "Definition: Differenz von Mengen"
  antwort:
    - "A \\ B = {x | x ∈ A und x ∉ B}"

- thema: "Mengen"
  frage: "Definition: Komplement"
  antwort:
    - "A^c = {x ∈ U | x ∉ A}"
    - "U ist die Grundmenge"

- thema: "Mengen"
  frage: "Definition: Potenzmenge"
  antwort:
    - "P(M) = {A | A ⊆ M}"

- thema: "Mengen"
  frage: "Definition: Kartesisches Produkt"
  antwort:
    - "A × B = {(a,b) | a ∈ A und b ∈ B}"
    - "Ein Kartesisches Produkt verknüpft zwei Mengen, indem es alle möglichen Kombinationen aus den Elementen beider Mengen bildet"
    - "A =  {1,2,3} und B = {1,2} => A × B = { (1,2), (1,3) (2,2), (2,3) (3,2), (3,3) }"

- thema: "Mengen"
  frage: "Definition: Mächtigkeit"
  antwort:
    - "|M| = Anzahl der Elemente von M (falls endlich)"
